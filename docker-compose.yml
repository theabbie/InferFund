services:
  postgres:
    image: postgres:17-alpine
    container_name: inferfund-postgres
    environment:
      POSTGRES_USER: inferfund
      POSTGRES_PASSWORD: inferfund
      POSTGRES_DB: inferfund
    ports:
      - "5432:5432"
    volumes:
      - inferfund-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferfund -d inferfund"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  inferfund-pgdata:
